[package]
name = "synology-assistant-rs"
version = "0.1.0"
edition = "2024"
description = "Fast, native replacement for Synology Assistant: find Synology NAS devices on your LAN, Wake-on-LAN, memory test"
license = "MIT"
repository = "https://github.com/denisq/synology-assistant-rs"
readme = "README.md"
keywords = ["synology", "nas", "wake-on-lan", "findhost", "egui"]
categories = ["network-programming", "gui"]

[dependencies]
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
dirs = "7"
eframe = "0.37"
egui_extras = "0.37"
if-addrs = "0.15"
open = "5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
socket2 = { version = "0.6", features = ["all"] }

[[bin]]
name = "synology-assistant"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
