name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./bundle.sh --target ${{ matrix.target }}
          cd dist && ditto -c -k --keepParent "Synology Assistant.app" "../SynologyAssistant-${{ matrix.target }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf SynologyAssistant-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release synology-assistant
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/synology-assistant.exe -DestinationPath SynologyAssistant-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SynologyAssistant-${{ matrix.target }}
          path: SynologyAssistant-${{ matrix.target }}.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SynologyAssistant-${{ matrix.target }}.*
